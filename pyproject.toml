[project]
name = "software-production-agent"
version = "0.2.0"
description = "Software production agent fabric (AIread.md)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "openai>=1.0.0",
  "rank-bm25>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
prod = ["gunicorn>=21.2.0"]
research = ["sentence-transformers>=3.0.0", "faiss-cpu>=1.7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
