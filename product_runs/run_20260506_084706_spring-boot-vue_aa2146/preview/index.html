<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Vue Preview</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7f4;
      --ink: #171a1d;
      --line: #d9ded4;
      --panel: #ffffff;
      --accent: #176f52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px 1fr;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #111815;
      color: white;
      padding: 22px;
    }
    aside h1 { margin: 0 0 24px; font-size: 20px; letter-spacing: 0; }
    nav button {
      width: 100%;
      min-height: 42px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: white;
      text-align: left;
      padding: 0 12px;
      font-weight: 720;
      cursor: pointer;
    }
    nav button.active { background: #e9f7ef; color: #124b38; }
    main { padding: 24px; display: grid; gap: 16px; align-content: start; }
    .hero, .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 36px rgba(26,30,27,.08);
    }
    .hero { padding: 20px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .hero h2 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfcf8; }
    .stat strong { display: block; font-size: 24px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    input, select {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font: inherit;
      background: white;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: #5f6861; font-size: 13px; }
    .badge { border-radius: 999px; padding: 4px 8px; background: #e9f7ef; color: #12513b; font-size: 12px; }
    .card { padding: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .timeline { display: grid; gap: 10px; }
    .timeline div { border-left: 3px solid var(--accent); padding-left: 10px; }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; }
      .hero, .grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>人员管理系统</h1>
      <nav>
        <button class="active" data-view="员工总览">员工总览</button>
        <button data-view="工资管理">工资管理</button>
        <button data-view="部门配置">部门配置</button>
        <button data-view="岗位流转">岗位流转</button>
      </nav>
    </aside>
    <main>
      <section class="hero">
        <div>
          <h2 id="viewTitle">员工总览</h2>
          <p>??Spring Boot+Vue???????????????????????????????</p>
          <div class="toolbar">
            <input id="search" placeholder="搜索姓名、部门或岗位">
            <select id="department">
              <option value="">全部部门</option>
              <option>研发部</option>
              <option>财务部</option>
              <option>人事部</option>
            </select>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span>员工</span><strong id="total">4</strong></div>
          <div class="stat"><span>平均工资</span><strong>12.8k</strong></div>
          <div class="stat"><span>待审批</span><strong>3</strong></div>
        </div>
      </section>
      <section class="grid">
        <div class="card">
          <table>
            <thead><tr><th>姓名</th><th>部门</th><th>岗位</th><th>工资</th><th>状态</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="card">
          <h3>项目成熟度提示</h3>
          <div class="timeline">
            <div>已生成前后端基础结构</div>
            <div>已有 API 健康检查和特性接口</div>
            <div>下一步需要接入数据库、鉴权和测试</div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const people = [
      { name: '林夏', department: '研发部', role: '后端工程师', salary: '15k', status: '在职' },
      { name: '周澄', department: '研发部', role: '前端工程师', salary: '13k', status: '试用' },
      { name: '许诺', department: '财务部', role: '薪酬专员', salary: '11k', status: '在职' },
      { name: '陈一', department: '人事部', role: 'HRBP', salary: '12k', status: '待调岗' }
    ];
    const rows = document.getElementById('rows');
    const search = document.getElementById('search');
    const department = document.getElementById('department');
    function render() {
      const q = search.value.trim().toLowerCase();
      const dep = department.value;
      const filtered = people.filter((p) => {
        const hit = [p.name, p.department, p.role].join(' ').toLowerCase().includes(q);
        return hit && (!dep || p.department === dep);
      });
      rows.innerHTML = filtered.map((p) => `
        <tr>
          <td>${p.name}</td><td>${p.department}</td><td>${p.role}</td><td>${p.salary}</td>
          <td><span class="badge">${p.status}</span></td>
        </tr>
      `).join('');
      document.getElementById('total').textContent = filtered.length;
    }
    document.querySelectorAll('nav button').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach((x) => x.classList.remove('active'));
        button.classList.add('active');
        document.getElementById('viewTitle').textContent = button.dataset.view;
      });
    });
    search.addEventListener('input', render);
    department.addEventListener('change', render);
    render();
  </script>
</body>
</html>
